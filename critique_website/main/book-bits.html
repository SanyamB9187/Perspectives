    <div class="book-bits-hero">
        <div class="overlay"></div>

        <div class="hero-content">
            <h1>Book Bits</h1>
            <p>Fragments of thought, captured from pages</p>
        </div>
    </div>

    <div class="quotes-container">
        <div class="quote-card">
        </div>
    </div>

    <div id="fullscreen-view" class="fullscreen hidden">
        <span class="close-btn" onclick="closeFullscreen()">×</span>
        <img id="fullscreen-img">
    </div>

    <footer class="footer">
        <p>"The only way to deal with an unfriendly world is to become friendly."</p>
        <span>- Ralph Waldo Emerson</span>
    </footer>

    <!-- ADD BUTTON -->
    <div class="add-btn" id="add-btn">+</div>

    <!-- EDITOR MODAL -->
    <div id="editor-modal" class="editor hidden">
        <div class="editor-box">
            <h2>Add a book bit</h2>
            <input type="file" id="bit-image">
            <img id="image-preview" style="display:none; width:100%; border-radius:10px;">
            <textarea id="bit-caption" placeholder="Write caption..."></textarea>
            <div class="editor-actions">
                <button id="publish-bit-btn">Publish</button>
                <button id="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

      <!-- INTRO MODAL -->
  <div id="intro-overlay" class="intro-overlay hidden" 
    data-intro-key="homepageIntroSeen"
    data-intro-label="PERSPECTIVES" 
    data-intro-title="Welcome to the Books-Bits Section" 
    data-intro-text="This section includes curated fragments from beloved books. A line or a paragraph that resonates with you or proves a point or makes you understand something better. You can add your own bits and captions by clicking the &quot;+&quot; button at the bottom right. ">

    <div class="intro-modal">

      <span class="intro-label"></span>

      <h2 class="intro-title"></h2>

      <p class="intro-text"></p>
      <button id="intro-btn" class="intro-btn">
        Enter
